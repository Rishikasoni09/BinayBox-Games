<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Blaster 2099</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060913;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 620px;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(236, 72, 153, 0.3);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .val { color: #ec4899; }
    .lives-val { color: #10b981; }
    canvas {
      background: #0a0e1a;
      border: 2px solid #ec4899;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.25);
      flex: 1;
      width: 100%;
      cursor: crosshair;
    }
    .touch-bar {
      display: none;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
    }
    .t-btn {
      flex: 1;
      background: #1f293d;
      border: 1px solid #ec4899;
      color: white;
      padding: 12px;
      font-weight: bold;
      border-radius: 8px;
      text-align: center;
      user-select: none;
    }
    .t-btn:active { background: #ec4899; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(6, 9, 19, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      z-index: 10;
    }
    .overlay h2 { font-size: 24px; color: #ec4899; margin-bottom: 12px; }
    .overlay p { font-size: 14px; color: #9ca3af; margin-bottom: 20px; text-align: center; max-width: 80%; }
    .start-btn {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
    }
    @media (max-width: 768px) {
      .touch-bar { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div>SCORE: <span id="score" class="val">0</span></div>
      <div>LIVES: <span id="lives" class="lives-val">❤❤❤</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div class="touch-bar">
      <div class="t-btn" id="btnLeft">◀ LEFT</div>
      <div class="t-btn" id="btnFire" style="background:#ec4899;">⚡ FIRE</div>
      <div class="t-btn" id="btnRight">RIGHT ▶</div>
    </div>

    <div id="startOverlay" class="overlay">
      <h2>SPACE BLASTER 2099</h2>
      <p>Defend the galaxy! Use Left/Right Arrow keys to navigate and Spacebar to shoot. Destroy enemy interceptors.</p>
      <button class="start-btn" onclick="startGame()">START MISSION</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('startOverlay');

    let player = { x: 180, y: 440, w: 32, h: 32, speed: 6 };
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];
    let keys = {};
    let score = 0;
    let lives = 3;
    let isRunning = false;
    let animId = null;
    let enemySpawnTimer = 0;

    // Generate background starfield
    for (let i = 0; i < 40; i++) {
      stars.push({ x: Math.random() * 400, y: Math.random() * 500, size: Math.random() * 2 + 1, speed: Math.random() * 1.5 + 0.5 });
    }

    function startGame() {
      overlay.style.display = 'none';
      player.x = 184;
      player.y = 440;
      bullets = [];
      enemies = [];
      particles = [];
      score = 0;
      lives = 3;
      scoreEl.textContent = score;
      updateLives();
      isRunning = true;
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function updateLives() {
      livesEl.textContent = '❤'.repeat(lives);
    }

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && isRunning) {
        shoot();
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch controls
    let moveLeft = false, moveRight = false;
    const btnL = document.getElementById('btnLeft');
    const btnR = document.getElementById('btnRight');
    const btnF = document.getElementById('btnFire');

    btnL.addEventListener('pointerdown', () => moveLeft = true);
    btnL.addEventListener('pointerup', () => moveLeft = false);
    btnR.addEventListener('pointerdown', () => moveRight = true);
    btnR.addEventListener('pointerup', () => moveRight = false);
    btnF.addEventListener('pointerdown', () => { if (isRunning) shoot(); });

    function shoot() {
      bullets.push({ x: player.x + 16 - 2, y: player.y, w: 4, h: 12, speed: 9 });
    }

    function spawnExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 20,
          color
        });
      }
    }

    function loop() {
      if (!isRunning) return;

      // Update stars
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > 500) s.y = 0;
      });

      // Player move
      if ((keys['ArrowLeft'] || keys['KeyA'] || moveLeft) && player.x > 0) {
        player.x -= player.speed;
      }
      if ((keys['ArrowRight'] || keys['KeyD'] || moveRight) && player.x < 400 - player.w) {
        player.x += player.speed;
      }

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -15) bullets.splice(i, 1);
      }

      // Spawn enemies
      enemySpawnTimer++;
      if (enemySpawnTimer > 35) {
        enemies.push({
          x: Math.random() * (400 - 30),
          y: -30,
          w: 28,
          h: 28,
          speed: Math.random() * 2 + 1.8
        });
        enemySpawnTimer = 0;
      }

      // Update enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        // Check bullet hit
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            spawnExplosion(e.x + 14, e.y + 14, '#ec4899');
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 25;
            scoreEl.textContent = score;
            break;
          }
        }

        // Check player collision
        if (e && e.y > 420 && e.x < player.x + player.w && e.x + e.w > player.x) {
          spawnExplosion(player.x + 16, player.y + 16, '#10b981');
          enemies.splice(i, 1);
          lives--;
          updateLives();
          if (lives <= 0) {
            gameOver();
            return;
          }
        } else if (e && e.y > 510) {
          enemies.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Render
      ctx.fillStyle = '#0a0e1a';
      ctx.fillRect(0, 0, 400, 500);

      // Stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Bullets
      ctx.fillStyle = '#06b6d4';
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 8;
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
      });

      // Enemies
      ctx.fillStyle = '#ec4899';
      ctx.shadowColor = '#ec4899';
      ctx.shadowBlur = 10;
      enemies.forEach(e => {
        ctx.beginPath();
        ctx.moveTo(e.x + e.w / 2, e.y + e.h);
        ctx.lineTo(e.x, e.y);
        ctx.lineTo(e.x + e.w, e.y);
        ctx.closePath();
        ctx.fill();
      });

      // Player Ship
      ctx.fillStyle = '#10b981';
      ctx.shadowColor = '#10b981';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(player.x + 16, player.y);
      ctx.lineTo(player.x, player.y + 30);
      ctx.lineTo(player.x + 16, player.y + 22);
      ctx.lineTo(player.x + 32, player.y + 30);
      ctx.closePath();
      ctx.fill();

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 4;
        ctx.fillRect(p.x, p.y, 3, 3);
      });

      ctx.shadowBlur = 0;
      animId = requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      overlay.querySelector('h2').textContent = 'MISSION FAILED';
      overlay.querySelector('p').innerHTML = `Final Score: <b style="color:#ec4899">${score}</b><br>Re-engage for planetary defense!`;
      overlay.querySelector('.start-btn').textContent = 'TRY AGAIN';
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>

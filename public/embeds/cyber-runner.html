<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      height: 100%;
      max-height: 480px;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    .score-val { color: #06b6d4; }
    canvas {
      background: #0b1120;
      border: 2px solid #06b6d4;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
      flex: 1;
      width: 100%;
    }
    .touch-btn {
      display: none;
      background: #06b6d4;
      color: #090d16;
      font-weight: bold;
      font-size: 18px;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      margin-top: 8px;
      user-select: none;
      cursor: pointer;
    }
    .touch-btn:active { background: #22d3ee; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      z-index: 10;
    }
    .overlay h2 { font-size: 24px; color: #06b6d4; margin-bottom: 12px; }
    .overlay p { font-size: 14px; color: #9ca3af; margin-bottom: 20px; text-align: center; max-width: 80%; }
    .start-btn {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
    }
    @media (max-width: 768px) {
      .touch-btn { display: block; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div>DISTANCE: <span id="score" class="score-val">0m</span></div>
      <div>BEST: <span id="best-score" style="color:#f59e0b">0m</span></div>
    </div>
    <canvas id="gameCanvas" width="500" height="300"></canvas>
    <div class="touch-btn" id="jumpBtn">TAP / HOLD TO JUMP</div>

    <div id="startOverlay" class="overlay">
      <h2>CYBER RUNNER</h2>
      <p>Dash through the neo-city grid! Press SPACE / Up Arrow or tap to jump over laser spikes and energy barriers.</p>
      <button class="start-btn" onclick="startGame()">START RUN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best-score');
    const overlay = document.getElementById('startOverlay');
    const jumpBtn = document.getElementById('jumpBtn');

    let isRunning = false;
    let animId = null;
    let score = 0;
    let best = localStorage.getItem('fl_runner_best') || 0;
    bestEl.textContent = `${best}m`;

    const player = {
      x: 60,
      y: 200,
      w: 24,
      h: 36,
      vy: 0,
      jumpForce: -11,
      gravity: 0.6,
      groundY: 200,
      jumpsLeft: 2
    };

    let obstacles = [];
    let clouds = [];
    let speed = 5;
    let spawnTimer = 0;

    function startGame() {
      overlay.style.display = 'none';
      player.y = player.groundY;
      player.vy = 0;
      player.jumpsLeft = 2;
      obstacles = [];
      score = 0;
      speed = 5;
      isRunning = true;
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function doJump() {
      if (!isRunning) return;
      if (player.jumpsLeft > 0) {
        player.vy = player.jumpForce;
        player.jumpsLeft--;
      }
    }

    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        doJump();
        e.preventDefault();
      }
    });

    jumpBtn.addEventListener('pointerdown', e => {
      e.preventDefault();
      doJump();
    });

    canvas.addEventListener('pointerdown', () => {
      if (isRunning) doJump();
    });

    function loop() {
      if (!isRunning) return;

      score++;
      scoreEl.textContent = `${Math.floor(score / 5)}m`;
      speed = 5 + Math.floor(score / 500) * 0.5;

      // Player physics
      player.vy += player.gravity;
      player.y += player.vy;
      if (player.y >= player.groundY) {
        player.y = player.groundY;
        player.vy = 0;
        player.jumpsLeft = 2;
      }

      // Spawn obstacles
      spawnTimer++;
      if (spawnTimer > 80 + Math.random() * 40) {
        const isTall = Math.random() > 0.6;
        obstacles.push({
          x: 520,
          y: isTall ? 180 : 205,
          w: isTall ? 20 : 24,
          h: isTall ? 56 : 31
        });
        spawnTimer = 0;
      }

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        // Collision detection
        if (
          player.x < obs.x + obs.w &&
          player.x + player.w > obs.x &&
          player.y < obs.y + obs.h &&
          player.y + player.h > obs.y
        ) {
          gameOver();
          return;
        }

        if (obs.x < -30) obstacles.splice(i, 1);
      }

      // Draw
      ctx.fillStyle = '#0b1120';
      ctx.fillRect(0, 0, 500, 300);

      // Grid ground
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 236);
      ctx.lineTo(500, 236);
      ctx.stroke();

      // Ground lines parallax
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
      const offset = (score * speed * 0.5) % 30;
      for (let x = -offset; x < 500; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 236);
        ctx.lineTo(x - 20, 300);
        ctx.stroke();
      }

      // Draw Obstacles
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      });

      // Draw Player
      ctx.fillStyle = '#06b6d4';
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 12;
      ctx.fillRect(player.x, player.y, player.w, player.h);

      ctx.shadowBlur = 0;
      animId = requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      const finalDist = Math.floor(score / 5);
      if (finalDist > best) {
        best = finalDist;
        localStorage.setItem('fl_runner_best', best);
        bestEl.textContent = `${best}m`;
      }
      overlay.querySelector('h2').textContent = 'CRASHED!';
      overlay.querySelector('p').innerHTML = `Total Distance: <b style="color:#06b6d4">${finalDist}m</b><br>Hit retry to run again!`;
      overlay.querySelector('.start-btn').textContent = 'RETRY RUN';
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Cyber Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
      height: 100%;
      max-height: 600px;
      padding: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 8px 16px;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .score-val { color: #10b981; }
    .high-val { color: #f59e0b; }
    canvas {
      background: #0d1322;
      border: 2px solid #6366f1;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
      flex: 1;
      width: 100%;
      max-height: 420px;
    }
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 280px;
      margin-top: 8px;
    }
    .btn {
      background: #1f293d;
      border: 1px solid #6366f1;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      user-select: none;
      text-align: center;
      cursor: pointer;
    }
    .btn:active { background: #6366f1; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      z-index: 10;
    }
    .overlay h2 { font-size: 24px; color: #6366f1; margin-bottom: 12px; }
    .overlay p { font-size: 14px; color: #9ca3af; margin-bottom: 20px; text-align: center; max-width: 80%; }
    .start-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }
    @media (max-width: 768px) {
      .touch-controls { display: grid; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div>SCORE: <span id="score" class="score-val">0</span></div>
      <div>HIGH SCORE: <span id="high-score" class="high-val">0</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="touch-controls">
      <div style="grid-column: 2" class="btn" onclick="setDir('UP')">▲</div>
      <div style="grid-column: 1; grid-row: 2" class="btn" onclick="setDir('LEFT')">◀</div>
      <div style="grid-column: 2; grid-row: 2" class="btn" onclick="setDir('DOWN')">▼</div>
      <div style="grid-column: 3; grid-row: 2" class="btn" onclick="setDir('RIGHT')">▶</div>
    </div>

    <div id="startOverlay" class="overlay">
      <h2>NEON CYBER SNAKE</h2>
      <p>Use Arrow Keys / WASD or on-screen buttons to control the neon snake. Collect cyber orbs to grow!</p>
      <button class="start-btn" onclick="startGame()">PLAY NOW</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high-score');
    const overlay = document.getElementById('startOverlay');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('fl_snake_high') || 0;
    let gameLoop = null;
    let isRunning = false;

    highEl.textContent = highScore;

    function startGame() {
      overlay.style.display = 'none';
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      score = 0;
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      scoreEl.textContent = score;
      spawnFood();
      isRunning = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 100);
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
      // Ensure food doesn't spawn on snake
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          spawnFood();
          break;
        }
      }
    }

    function setDir(dir) {
      if (!isRunning) return;
      if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
      else if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
      else if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
      else if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { setDir('UP'); e.preventDefault(); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { setDir('DOWN'); e.preventDefault(); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { setDir('LEFT'); e.preventDefault(); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { setDir('RIGHT'); e.preventDefault(); }
    });

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision wrap-around or death
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Food eaten
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highEl.textContent = highScore;
          localStorage.setItem('fl_snake_high', highScore);
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear background
      ctx.fillStyle = '#0d1322';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid lines
      ctx.strokeStyle = 'rgba(99, 102, 241, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#10b981';
      ctx.shadowColor = '#10b981';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      ctx.shadowBlur = 10;
      snake.forEach((seg, index) => {
        if (index === 0) {
          ctx.fillStyle = '#818cf8';
          ctx.shadowColor = '#818cf8';
        } else {
          ctx.fillStyle = '#6366f1';
          ctx.shadowColor = '#6366f1';
        }
        ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      overlay.querySelector('h2').textContent = 'GAME OVER';
      overlay.querySelector('p').innerHTML = `Final Score: <b style="color:#10b981">${score}</b><br>Try again to beat the high score!`;
      overlay.querySelector('.start-btn').textContent = 'RETRY';
      overlay.style.display = 'flex';
    }

    // Initial render
    draw();
  </script>
</body>
</html>
